<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Innovation Studios</title>
<style>
  :root { --paper: #F4F1E8; --ink: #2A3338; --sky: #C5D3DC; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 32rem; text-align: center; }
  h1 { margin: 0 0 1.5rem; font-size: 1.75rem; font-weight: 600; letter-spacing: 0.01em; }
  .app {
    display: inline-block;
    padding: 0.6rem 1.4rem;
    border-radius: 999px;
    background: var(--sky);
    color: var(--ink);
    font-weight: 600;
    text-decoration: none;
  }
  .app:hover, .app:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  footer { margin-top: 2.5rem; font-size: 0.9rem; }
  footer a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <h1>Swiss Innovation Studios</h1>
  <a class="app" href="https://swissinnovationstudios.github.io/teide/">Teide</a>
  <footer>
    <a href="https://swissinnovationstudios.github.io/teide/impressum.html">Impressum</a>
    &middot;
    <a href="https://swissinnovationstudios.github.io/teide/datenschutz.html">Datenschutz</a>
  </footer>
</main>
</body>
</html>
